<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lost & Found Label Printer</title>
<style>
:root {
  --bg:#0d0d0f; --surface:#17171a; --surface2:#1e1e22; --border:#2a2a30;
  --border-hover:#3a3a42; --accent:#f5a11e; --accent-dim:#f5a11e22;
  --text:#f0f0f2; --text-dim:#8a8a92; --text-faint:#55555c;
  --danger:#ef5350; --danger-bg:#2a1516; --success:#4caf50; --success-bg:#132a16;
}
* { box-sizing:border-box; margin:0; padding:0; }
body {
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;
  background:var(--bg); color:var(--text); min-height:100vh;
  display:flex; flex-direction:column; align-items:center;
  padding:48px 16px; letter-spacing:-0.01em;
}
.wrap { width:100%; max-width:460px; }
.brand { display:flex; flex-direction:column; align-items:center; margin-bottom:32px; }
.brand img { height:76px; width:auto; opacity:0.96; }
.brand .kicker {
  color:var(--text-faint); font-size:11px; letter-spacing:2px; text-transform:uppercase;
  margin-top:14px; font-weight:600;
}
.card {
  background:var(--surface); border:1px solid var(--border); border-radius:16px;
  padding:28px; box-shadow:0 1px 0 rgba(255,255,255,0.02) inset, 0 20px 60px -20px rgba(0,0,0,0.6);
}
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.field { margin-bottom:16px; }
.field label {
  display:flex; align-items:center; gap:6px;
  font-size:11px; font-weight:700; color:var(--text-dim);
  text-transform:uppercase; letter-spacing:0.8px; margin-bottom:7px;
}
.field label .tag {
  font-weight:500; color:var(--text-faint); text-transform:none;
  letter-spacing:0; font-size:10px; background:var(--surface2);
  padding:1px 6px; border-radius:20px;
}
.field .row { display:flex; align-items:stretch; }
.prefix-badge {
  display:flex; align-items:center; justify-content:center;
  background:var(--surface2); border:1px solid var(--border); border-right:none;
  border-radius:9px 0 0 9px; padding:0 12px; font-size:14px; font-weight:700;
  color:var(--accent); white-space:nowrap; min-width:44px;
}
input {
  width:100%; padding:11px 13px; border:1px solid var(--border); border-radius:9px;
  font-size:14.5px; font-family:inherit; color:var(--text); background:var(--surface2);
  transition:border-color .15s, background .15s;
}
input.with-prefix { border-radius:0 9px 9px 0; }
input:hover { border-color:var(--border-hover); }
input:focus { outline:none; border-color:var(--accent); background:#212125; }
input::placeholder { color:var(--text-faint); }
input.readonly { background:#191919; color:var(--text-dim); }
.hint { font-size:11px; color:var(--text-faint); margin-top:6px; }
.divider { height:1px; background:var(--border); margin:20px 0; border:none; }
.preview-label {
  font-size:11px; font-weight:700; color:var(--text-dim);
  text-transform:uppercase; letter-spacing:0.8px; margin-bottom:10px;
  display:flex; align-items:center; justify-content:space-between;
}
.preview-box {
  background:var(--bg); border:1px solid var(--border); border-radius:12px;
  padding:14px; margin-bottom:20px; min-height:76px;
  display:flex; flex-wrap:wrap; gap:8px; align-content:flex-start;
}
.tag-chip {
  background:var(--surface2); border:1px solid var(--border); border-radius:8px;
  padding:8px 14px; text-align:center; min-width:88px;
}
.tag-chip .rcv { color:var(--text-faint); font-size:9px; text-transform:uppercase; letter-spacing:0.5px; }
.tag-chip .code { color:var(--accent); font-weight:700; font-size:15px; letter-spacing:0.3px; margin:2px 0; }
.tag-chip .exp { color:#e07a7a; font-size:9px; text-transform:uppercase; letter-spacing:0.5px; }
.more-chip {
  display:flex; align-items:center; justify-content:center;
  color:var(--text-faint); font-size:12px; padding:8px 14px;
}
.placeholder-text { color:var(--text-faint); font-size:12.5px; padding:8px 4px; }
.btn {
  width:100%; background:var(--accent); color:#14100a; border:none; border-radius:10px;
  padding:14px; font-size:14.5px; font-weight:700; cursor:pointer;
  transition:filter .15s, transform .1s; letter-spacing:0.2px;
}
.btn:hover { filter:brightness(1.08); }
.btn:active { transform:scale(0.99); }
.btn:disabled { background:var(--surface2); color:var(--text-faint); cursor:not-allowed; }
.msg {
  margin-top:14px; padding:12px 16px; border-radius:10px; font-size:13px;
  font-weight:600; display:none; border:1px solid transparent;
}
.msg.ok { background:var(--success-bg); color:var(--success); border-color:#1e4620; display:flex; align-items:center; gap:8px; }
.msg.err { background:var(--danger-bg); color:var(--danger); border-color:#4a2224; display:flex; align-items:center; gap:8px; }
.footer {
  margin-top:24px; display:flex; align-items:center; justify-content:center; gap:14px;
  color:var(--text-faint); font-size:11.5px; letter-spacing:0.2px;
}
.footer a { color:var(--text-faint); text-decoration:none; transition:color .15s; }
.footer a:hover { color:var(--text-dim); }
.footer .dot { opacity:0.4; }
.login-card { text-align:center; }
.login-card .field { text-align:left; margin-top:20px; }
.spinner {
  width:14px; height:14px; border:2px solid rgba(20,16,10,0.25);
  border-top-color:#14100a; border-radius:50%; animation:spin .6s linear infinite;
  display:inline-block; vertical-align:-2px; margin-right:6px;
}
@keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>

<script>
const API = "https://lf-label-printer.david-pedersen.workers.dev";

let TOKEN = localStorage.getItem("lnf_token") || null;
let SETTINGS = { prefix: "26", maxQuantity: 100, maxLabelNumber: 9999 };

function pad2(n) { return String(n).padStart(2, "0"); }
function pad4(n) { return String(n).padStart(4, "0"); }
function fmtISO(d) { return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate()); }
function fmtDisplay(val) { const p = val.split("-"); return parseInt(p[1]) + "/" + parseInt(p[2]) + "/" + p[0]; }

async function init() {
  if (!TOKEN) { showLogin(); return; }
  const ok = await loadSettings();
  if (ok) { showApp(); } else { showLogin(); }
}

function showLogin() {
  document.getElementById("loginView").style.display = "block";
  document.getElementById("appView").style.display = "none";
}

function showApp() {
  document.getElementById("loginView").style.display = "none";
  document.getElementById("appView").style.display = "block";
  setupForm();
  maybeAutoPrint();
}

// Read a code/label number from the URL query string, e.g.
//   ?print=26-1363     (full code, prefix ignored -- trailing number is used)
//   ?print=1363        (bare number)
//   ?print=26-1363&qty=2
// Returns { num, qty } or null if there's nothing to auto-print.
function getPrintParam() {
  const p = new URLSearchParams(location.search);
  const raw = p.get("print") || p.get("code") || p.get("start");
  if (!raw) return null;
  const digits = String(raw).includes("-") ? String(raw).split("-").pop() : raw;
  const num = parseInt(digits, 10);
  if (isNaN(num)) return null;
  const qty = parseInt(p.get("qty") || "1", 10) || 1;
  return { num: num, qty: qty };
}

// If the page was opened with a ?print= link (e.g. clicked from Excel),
// fill the form and submit it automatically -- one click = one print.
function maybeAutoPrint() {
  const auto = getPrintParam();
  if (!auto) return;
  document.getElementById("start").value = auto.num;
  document.getElementById("qty").value = auto.qty;
  updatePreview();
  const msg = document.getElementById("msg");
  msg.className = "msg";
  msg.style.display = "flex";
  msg.textContent = "Auto-printing " + SETTINGS.prefix + "-" + pad4(auto.num) + "...";
  sendPrint();
}

async function doLogin() {
  const password = document.getElementById("loginPassword").value;
  const msg = document.getElementById("loginMsg");
  msg.style.display = "none";
  try {
    const r = await fetch(API + "/api/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: password })
    });
    const data = await r.json();
    if (data.success) {
      TOKEN = data.token;
      localStorage.setItem("lnf_token", TOKEN);
      const ok = await loadSettings();
      if (ok) showApp();
    } else {
      msg.textContent = data.error || "Login failed.";
      msg.style.display = "flex";
    }
  } catch (e) {
    msg.textContent = "Could not reach the server.";
    msg.style.display = "flex";
  }
}

function doLogout() {
  localStorage.removeItem("lnf_token");
  TOKEN = null;
  showLogin();
}

async function loadSettings() {
  try {
    const r = await fetch(API + "/api/settings", {
      headers: { "Authorization": "Bearer " + TOKEN }
    });
    if (r.status === 401) { localStorage.removeItem("lnf_token"); TOKEN = null; return false; }
    const data = await r.json();
    if (data.success) { SETTINGS = data.settings; return true; }
    return false;
  } catch (e) { return false; }
}

function setupForm() {
  document.getElementById("prefixBadge").textContent = SETTINGS.prefix + "-";
  document.getElementById("start").max = SETTINGS.maxLabelNumber;
  document.getElementById("qty").max = SETTINGS.maxQuantity;

  const today = new Date();
  document.getElementById("rcv").value = fmtISO(today);
  const exp = new Date(today); exp.setMonth(exp.getMonth() + 1);
  document.getElementById("exp").value = fmtISO(exp);

  document.getElementById("rcv").addEventListener("change", function() {
    const d = new Date(this.value + "T00:00:00");
    if (!isNaN(d)) { d.setMonth(d.getMonth() + 1); document.getElementById("exp").value = fmtISO(d); }
    updatePreview();
  });
  ["exp", "start", "qty"].forEach(function(id) {
    document.getElementById(id).addEventListener("input", updatePreview);
  });

  updatePreview();
}

function updatePreview() {
  const rcvVal = document.getElementById("rcv").value;
  const expVal = document.getElementById("exp").value;
  const start = parseInt(document.getElementById("start").value);
  const qty = parseInt(document.getElementById("qty").value);
  const box = document.getElementById("preview");

  if (!rcvVal || !expVal || isNaN(start) || isNaN(qty)) {
    box.innerHTML = '<div class="placeholder-text">Fill in the fields above to preview.</div>';
    return;
  }

  const show = Math.min(qty, 4);
  let html = "";
  for (let i = 0; i < show; i++) {
    const code = SETTINGS.prefix + "-" + pad4(start + i);
    html += '<div class="tag-chip">' +
      '<div class="rcv">Rcv ' + fmtDisplay(rcvVal) + '</div>' +
      '<div class="code">' + code + '</div>' +
      '<div class="exp">Exp ' + fmtDisplay(expVal) + '</div></div>';
  }
  if (qty > 4) html += '<div class="more-chip">+' + (qty - 4) + ' more</div>';
  box.innerHTML = html;
}

async function sendPrint() {
  const rcvVal = document.getElementById("rcv").value;
  const expVal = document.getElementById("exp").value;
  const start = parseInt(document.getElementById("start").value);
  const qty = parseInt(document.getElementById("qty").value);
  const msg = document.getElementById("msg");
  const btn = document.getElementById("btn");
  msg.className = "msg";

  if (!rcvVal) return showErr("Enter a received date.");
  if (!expVal) return showErr("Enter an expiration date.");
  if (isNaN(start) || start < 1 || start > SETTINGS.maxLabelNumber)
    return showErr("Starting label # must be 1-" + SETTINGS.maxLabelNumber + ".");
  if (isNaN(qty) || qty < 1 || qty > SETTINGS.maxQuantity)
    return showErr("Quantity must be 1-" + SETTINGS.maxQuantity + ".");
  if (start + qty - 1 > SETTINGS.maxLabelNumber)
    return showErr("Would exceed " + SETTINGS.maxLabelNumber + " (last: " + (start+qty-1) + ").");

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Sending...';

  try {
    const r = await fetch(API + "/api/print", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + TOKEN },
      body: JSON.stringify({ rcv: rcvVal, exp: expVal, start: start, quantity: qty })
    });
    const data = await r.json();
    if (data.success) {
      msg.className = "msg ok";
      const lastCode = qty > 1 ? (" to " + SETTINGS.prefix + "-" + pad4(start+qty-1)) : "";
      msg.innerHTML = "Queued " + qty + " label(s) &middot; " + fmtDisplay(rcvVal) + " &middot; " + SETTINGS.prefix + "-" + pad4(start) + lastCode;
      document.getElementById("start").value = start + qty;
      document.getElementById("qty").value = 1;
      updatePreview();
    } else {
      showErr(data.error || "Print failed.");
    }
  } catch (e) {
    showErr("Could not reach the print server.");
  } finally {
    btn.disabled = false;
    btn.textContent = "Print labels";
  }
}

function showErr(m) {
  const el = document.getElementById("msg");
  el.className = "msg err"; el.textContent = m; el.style.display = "flex";
}

init();
</script>
